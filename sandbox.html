<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>ropesim</title>
        <link rel="stylesheet" href="sandstyles.css">
    </head>
    <body>
        <div id="toolbar">
            <button id="ropeButton" type="button">Rope</button>
            <label>
                Length:
                <input id="length" type="number" value="200" min="50" max="1500">
            </label>
            <button id="ballButton" type="button">Ball</button>
            <label>
                Radius:
                <input id="radius" type="number" value="50" min="50" max="150">
            </label>
            <label>
                Weight:
                <input id="weight" type="number" value="2" min="1" max="3">
            </label>
            <button id="resetButton" type="button">Reset</button>
        </div>
        <canvas id="canvas"></canvas>
        <script src="rope.js"></script>
        <script src="ball.js"></script>
    </body>
</html>
